---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: v-ananke-dev
  namespace: argocd
spec:
  project: default
  destination:
    name: ""
    namespace: "v-ananke-dev"
    server: "https://kubernetes.default.svc"
  source:
    path: vclusters
    repoURL: "git@github.com:TheStopsign/ananke"
    targetRevision: HEAD
    helm:
      valueFiles:
        - ananke-dev.yaml
  syncPolicy:
    automated:
      prune: true
      allowEmpty: true
      selfHeal: true
    managedNamespaceMetadata:
      annotations: # The annotations to set on the application namespace
        linkerd.io/inject: enabled
    syncOptions:
      - CreateNamespace=true
