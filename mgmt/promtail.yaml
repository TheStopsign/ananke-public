---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: promtail
  namespace: argocd
spec:
  destination:
    name: ""
    namespace: "promtail"
    server: "https://kubernetes.default.svc"
  source:
    path: mgmt/promtail
    repoURL: "git@github.com:TheStopsign/ananke"
    targetRevision: HEAD
    helm:
  syncPolicy:
    automated:
      prune: true
      allowEmpty: true
      selfHeal: true
  project: default
