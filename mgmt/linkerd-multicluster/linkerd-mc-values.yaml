linkerd-jaeger:
  jaeger:
    enabled: false # We don't need the Jaeger UI, we'll just use Grafana
  collector:
    config: |
      receivers:
        otlp:
          protocols:
            http:
            grpc:
        opencensus:
        zipkin:
        jaeger:
          protocols:
            grpc:
            thrift_http:
            thrift_compact:
            thrift_binary:
      processors:
        batch:
      extensions:
        health_check:
      exporters:
        jaeger:
          endpoint: tempo-distributor.tempo:14250
          tls:
            insecure: true
        # jaeger:
        #   endpoint: jaeger.linkerd-jaeger:14250
        #   tls:
        #     insecure: true
      service:
        extensions: [health_check]
        pipelines:
          traces:
            receivers: [otlp,opencensus,zipkin,jaeger]
            processors: [batch]
            exporters: [jaeger]
