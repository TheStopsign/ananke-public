minio:
  enabled: false

tempo-distributed:
  minio:
    enabled: false
  storage:
    trace:
      backend: s3
      s3:
        access_key: "grafana-tempo"
        secret_key: "supersecret"
        bucket: "tempo-traces"
        endpoint: "minio.minio:9000"
        insecure: true
  server:
    logLevel: "debug"
  traces:
    jaeger:
      grpc:
        enabled: true
      thriftHttp:
        enabled: true
  distributor:
    receivers:
      jaeger:
        protocols:
          thrift_http:
          grpc:
          thrift_binary:
          thrift_compact:
    log_received_spans:
      enabled: true
