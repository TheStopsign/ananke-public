---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
spec:
  project: default
  destination:
    name: ""
    namespace: "tempo"
    server: "https://kubernetes.default.svc"
  source:
    path: mgmt/tempo
    repoURL: "git@github.com:TheStopsign/ananke"
    targetRevision: HEAD
    helm:
      valueFiles:
        - tempo-values.yaml
  syncPolicy:
    automated:
      prune: true
      allowEmpty: true
      selfHeal: true
    managedNamespaceMetadata:
      annotations: # The annotations to set on the application namespace
        linkerd.io/inject: enabled
    syncOptions:
      - CreateNamespace=true
